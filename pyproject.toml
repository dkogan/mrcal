# Experimental pip-building thing for mrcal.
#
# Written 100% by Claude. Pip is heinous and stupid, and nobody should be using
# it. This may or may not work for you. If it does not, let me know, and/or
# better yet, send me a patch!

[build-system]
requires = ["numpy"]
build-backend = "_mrcal_build_backend"
backend-path = ["packaging"]

[project]
name = "mrcal"
dynamic = ["version"]
description = "Calibration and SFM library"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "numpysane>=0.35",
    "scipy>=0.18",
    "gnuplotlib>=0.38",
    "shapely",
    "pyyaml",
    "pyfltk",
]

[project.urls]
Homepage = "https://mrcal.secretsauce.net"

# ---------------------------------------------------------------------------
# cibuildwheel — builds binary wheels for Linux (manylinux) and macOS.
# Run locally:  pipx run cibuildwheel --platform linux   (or macos)
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
# Build for Python 3.12 – 3.14; skip musl (Alpine) — mrcal needs glibc
build = "cp312-* cp313-* cp314-*"
skip  = "*-musllinux*"

[tool.cibuildwheel.linux]
# Standard manylinux_2_28 image (AlmaLinux); Python 3.9–3.13 pre-installed.
# before-all installs C deps via dnf/EPEL and builds libdogleg from source.
before-all   = "bash {project}/packaging/build-deps-linux.sh"
before-build = "bash {project}/packaging/before-build.sh"
environment-pass = ["VERSION_WHEEL_BASE", "VERSION_WHEEL_POST"]
manylinux-x86_64-image = "manylinux_2_28"

# Uncomment to persist the dnf package cache on the host so RPMs aren't re-downloaded each run.
# container-engine = {name = "docker", create-args = ["--volume=/mnt/data/mrcal-dnf-cache:/var/cache/dnf"]}

[tool.cibuildwheel.macos]
archs      = ["arm64"]
before-all   = "bash {project}/packaging/build-deps-macos.sh"
before-build = "bash {project}/packaging/before-build.sh"
environment = {MACOSX_DEPLOYMENT_TARGET = "14.0"}
